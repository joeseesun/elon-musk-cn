# 放在 vhost 文件顶部（http 上下文）：
# 搜索页翻译反代（/api/tr）：每 IP 每分钟 30 次，缓存 30 天
limit_req_zone $binary_remote_addr zone=elon_tr:2m rate=30r/m;
proxy_cache_path /www/server/nginx/elon_tr_cache levels=1:2 keys_zone=elon_trc:4m inactive=30d max_size=200m use_temp_path=off;
# 放进 443 的 server { } 里：
    # 免费谷歌翻译反代：国内浏览器连不上 translate.googleapis.com，搜索页经本站转发；只放行 en / zh-CN，限速并缓存 30 天
    location = /api/tr {
        limit_req zone=elon_tr burst=30 nodelay;
        limit_req_status 429;
        if ($arg_tl !~ "^(en|zh-CN)$") { return 400; }
        if ($arg_q = "") { return 400; }
        if ($args ~ "^.{1200,}") { return 414; }
        resolver 1.1.1.1 8.8.8.8 ipv6=off valid=300s;
        resolver_timeout 3s;
        proxy_pass https://translate.googleapis.com/translate_a/single?client=gtx&sl=auto&dt=t&dt=bd&tl=$arg_tl&q=$arg_q;
        proxy_ssl_server_name on;
        proxy_set_header Host translate.googleapis.com;
        proxy_set_header Cookie "";
        proxy_set_header Referer "";
        proxy_set_header Accept-Encoding "";
        proxy_set_header X-Forwarded-For "";
        proxy_set_header X-Real-IP "";
        proxy_set_header User-Agent "Mozilla/5.0";
        proxy_connect_timeout 4s;
        proxy_read_timeout 6s;
        proxy_cache elon_trc;
        proxy_cache_key "$arg_tl|$arg_q";
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        proxy_cache_use_stale error timeout updating http_429 http_500 http_502 http_503;
        proxy_ignore_headers Cache-Control Expires Set-Cookie Vary;
        proxy_hide_header Content-Security-Policy;
        proxy_hide_header Content-Disposition;
        proxy_hide_header Cross-Origin-Opener-Policy;
        proxy_hide_header Cross-Origin-Resource-Policy;
        proxy_hide_header Access-Control-Allow-Origin;
        proxy_hide_header Accept-CH;
        proxy_hide_header Permissions-Policy;
        proxy_hide_header Reporting-Endpoints;
        proxy_hide_header Document-Policy;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_hide_header Pragma;
        proxy_hide_header Set-Cookie;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header X-XSS-Protection;
        proxy_hide_header Alt-Svc;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Cache $upstream_cache_status always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        access_log off;
    }
